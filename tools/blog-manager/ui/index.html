<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog manager</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="app-head" id="app-head">
    <a class="brand" href="#/">Blog manager</a>
    <span class="spacer"></span>
    <span id="chip-astro" class="chip" role="status"></span>
    <span id="chip-gh" class="chip" role="status"></span>
    <button id="new-btn" type="button" class="btn dark">Write a story</button>
  </header>
  <div id="banners" role="status"></div>
  <main id="view"></main>

  <dialog id="new-dialog" aria-labelledby="new-title">
    <form method="dialog" id="new-form">
      <h2 id="new-title">Write a story</h2>
      <label>Title <input id="n-title" type="text" required maxlength="200"></label>
      <label>Slug <input id="n-slug" type="text" required maxlength="80" pattern="[a-z0-9]+(-[a-z0-9]+)*"></label>
      <label>Description <input id="n-desc" type="text" maxlength="500"></label>
      <p id="n-error" class="error" role="alert"></p>
      <div class="actions">
        <button type="button" class="btn" id="n-cancel">Cancel</button>
        <button type="submit" class="btn dark">Create draft</button>
      </div>
    </form>
  </dialog>

  <dialog id="delete-dialog" aria-labelledby="delete-title">
    <form method="dialog" id="delete-form">
      <h2 id="delete-title">Delete post</h2>
      <p>This removes the Markdown file and its images. Type <strong id="d-slug"></strong> to confirm.</p>
      <input id="d-input" type="text" aria-label="Type the slug to confirm" autocomplete="off">
      <p id="d-error" class="error" role="alert"></p>
      <div class="actions">
        <button type="button" class="btn" id="d-cancel">Cancel</button>
        <button type="submit" class="btn danger" id="d-ok" disabled>Delete</button>
      </div>
    </form>
  </dialog>

  <dialog id="publish-dialog" class="wide" aria-labelledby="pub-title"></dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
